name: Linux

on:
  push:
    branches: [master, motivation, overhaul]
  pull_request:
    branches: [master, motivation, overhaul]

  workflow_dispatch:
    inputs:
      engine_ref:
        description: Optional engine branch, tag, or commit override
        required: false
        type: string
  workflow_call:
    inputs:
      engine_ref:
        description: Engine branch, tag, or commit selected by the manual launcher
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        buildconfig: [Editor, Game_linux]
        configuration: [Debug, Release]
        include:
          - buildconfig: Editor
            target: Havana
            binary: Havana
          - buildconfig: Game_linux
            target: Game_EntryPoint
            binary: Game_EntryPoint_x64

    steps:
      - name: Check out the engine revision
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.engine_ref || github.event.pull_request.head.sha || github.sha }}
          path: Engine
          submodules: true
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Generate a new project
        run: bash Engine/Tools/NewProjectSetup.sh EmptyProject

      - name: Compile Tools
        if: ${{ matrix.buildconfig == 'Game_linux' }}
        run: bash Engine/Tools/BuildProject.sh Havana editor_release

      - name: Compile Project
        run: |
          config=$(echo "${{ matrix.buildconfig }}_${{ matrix.configuration }}" | tr '[:upper:]' '[:lower:]')
          bash Engine/Tools/BuildProject.sh "${{ matrix.target }}" "$config"

      - name: Copy Assets
        run: bash CopyAssets.sh "${{ matrix.buildconfig }}_${{ matrix.configuration }}"

      - name: Cook Assets
        if: ${{ matrix.buildconfig == 'Game_linux' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          bash CopyAssets.sh Editor_Release
          # The cook resolves Engine/Tools/linux/shaderc relative to its
          # working directory and expects texturec on PATH.
          mkdir -p .build/Editor_Release/Engine/Tools
          cp -a Engine/Tools/linux .build/Editor_Release/Engine/Tools/
          bash Engine/Tools/NixEnv.sh bash -c 'cd .build/Editor_Release && PATH="$PWD/Engine/Tools/linux:$PATH" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./Havana -CompileAssets'

      - name: Copy Cooked Assets
        if: ${{ matrix.buildconfig == 'Game_linux' }}
        continue-on-error: true
        run: cp -a .build/Editor_Release/Assets/. ".build/Game_linux_${{ matrix.configuration }}/Assets/"

      - name: Package
        run: bash Engine/Tools/NixEnv.sh bash Engine/Tools/PackageLinuxBuild.sh "${{ matrix.buildconfig }}_${{ matrix.configuration }}" "${{ matrix.binary }}"

      - name: Archive Build
        uses: actions/upload-artifact@v4
        with:
          name: EmptyProject v${{ github.run_number }} - ${{ matrix.buildconfig }}_${{ matrix.configuration }} (Linux)
          path: ${{ matrix.buildconfig }}_${{ matrix.configuration }}.tar.gz
