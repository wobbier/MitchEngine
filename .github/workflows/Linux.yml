name: Linux

on:
  push:
    branches: [master, motivation]
  pull_request:
    branches: [master, motivation]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ENGINE_REF: ${{ github.head_ref || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        buildconfig: [Editor, Game_linux]
        configuration: [Debug, Release]
        include:
          - buildconfig: Editor
            target: Havana
            binary: Havana
          - buildconfig: Game_linux
            target: Game_EntryPoint
            binary: Game_EntryPoint_x64

    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Grab the project setup file
        run: curl -fsSLO "https://raw.githubusercontent.com/wobbier/MitchEngine/${ENGINE_REF}/Tools/NewProjectSetup.sh"

      - name: Generate a new project
        run: bash NewProjectSetup.sh EmptyProject "$ENGINE_REF"

      - name: Compile Tools
        if: ${{ matrix.buildconfig == 'Game_linux' }}
        run: nix develop --command make -f EmptyProject.make Havana config=editor_release -j"$(nproc)"

      - name: Compile Project
        run: |
          config=$(echo "${{ matrix.buildconfig }}_${{ matrix.configuration }}" | tr '[:upper:]' '[:lower:]')
          nix develop --command make -f EmptyProject.make "${{ matrix.target }}" config="$config" -j"$(nproc)"

      - name: Copy Assets
        run: bash CopyAssets.sh "${{ matrix.buildconfig }}_${{ matrix.configuration }}"

      - name: Cook Assets
        if: ${{ matrix.buildconfig == 'Game_linux' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          bash CopyAssets.sh Editor_Release
          # The cook resolves Engine/Tools/linux/shaderc relative to its
          # working directory and expects texturec on PATH.
          mkdir -p .build/Editor_Release/Engine/Tools
          cp -a Engine/Tools/linux .build/Editor_Release/Engine/Tools/
          nix develop --command bash -c 'cd .build/Editor_Release && PATH="$PWD/Engine/Tools/linux:$PATH" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./Havana -CompileAssets'

      - name: Copy Cooked Assets
        if: ${{ matrix.buildconfig == 'Game_linux' }}
        continue-on-error: true
        run: cp -a .build/Editor_Release/Assets/. ".build/Game_linux_${{ matrix.configuration }}/Assets/"

      - name: Package
        run: nix develop --command bash Engine/Tools/PackageLinuxBuild.sh "${{ matrix.buildconfig }}_${{ matrix.configuration }}" "${{ matrix.binary }}"

      - name: Archive Build
        uses: actions/upload-artifact@v4
        with:
          name: EmptyProject v${{ github.run_number }} - ${{ matrix.buildconfig }}_${{ matrix.configuration }} (Linux)
          path: ${{ matrix.buildconfig }}_${{ matrix.configuration }}.tar.gz
