name: macOS

on:
  push:
    branches: [master, motivation, overhaul]

  pull_request:
    branches: [master, motivation, overhaul]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
        type:
          - Editor
          - Game_macOS

    steps:
      - name: Check out the engine revision
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: Engine
          submodules: true
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail

          bash Engine/Tools/NewProjectSetup.command EmptyProject

          echo "Generated workspace:"
          find . -maxdepth 2 \
            \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) \
            -print

      - name: Build Editor
        if: ${{ matrix.type == 'Editor' }}
        uses: mxcl/xcodebuild@v3
        with:
          xcode: ^16
          platform: macOS
          action: build
          code-coverage: true
          warnings-as-errors: false
          workspace: EmptyProject.xcworkspace
          configuration: ${{ matrix.type }}_${{ matrix.configuration }}
          scheme: Havana_mac

      - name: Build Game
        if: ${{ matrix.type == 'Game_macOS' }}
        uses: mxcl/xcodebuild@v3
        with:
          xcode: ^16
          platform: macOS
          action: build
          code-coverage: true
          warnings-as-errors: false
          workspace: EmptyProject.xcworkspace
          configuration: ${{ matrix.type }}_${{ matrix.configuration }}
          scheme: Game_EntryPoint_mac

      - name: Copy Assets
        shell: bash
        run: echo "TODO"

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: EmptyProject - ${{ matrix.type }} - ${{ matrix.configuration }}
          path: Build
          if-no-files-found: warn