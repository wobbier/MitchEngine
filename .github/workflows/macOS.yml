name: macOS

on:
  push:
    branches: [master, motivation]

  pull_request:
    branches: [master, motivation]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
        type:
          - Editor
          - Game_macOS

    env:
      ENGINE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ENGINE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      ENGINE_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Download project setup
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --show-error \
            --output NewProjectSetup.command \
            "https://raw.githubusercontent.com/${ENGINE_REPOSITORY}/${ENGINE_REVISION}/Tools/NewProjectSetup.command"

          echo "Downloaded setup script:"
          head -n 5 NewProjectSetup.command

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "5.0.100"

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating from branch: ${ENGINE_BRANCH}"
          bash NewProjectSetup.command EmptyProject "${ENGINE_BRANCH}"

          echo "Generated workspace:"
          find . -maxdepth 2 \
            \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) \
            -print

      - name: Build Editor
        if: ${{ matrix.type == 'Editor' }}
        uses: mxcl/xcodebuild@v3
        with:
          xcode: ^16
          platform: macOS
          action: build
          code-coverage: true
          warnings-as-errors: false
          workspace: EmptyProject.xcworkspace
          configuration: ${{ matrix.type }}_${{ matrix.configuration }}
          scheme: Havana_mac

      - name: Build Game
        if: ${{ matrix.type == 'Game_macOS' }}
        uses: mxcl/xcodebuild@v3
        with:
          xcode: ^16
          platform: macOS
          action: build
          code-coverage: true
          warnings-as-errors: false
          workspace: EmptyProject.xcworkspace
          configuration: ${{ matrix.type }}_${{ matrix.configuration }}
          scheme: Game_EntryPoint_mac

      - name: Copy Assets
        shell: bash
        run: echo "TODO"

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: EmptyProject - ${{ matrix.type }} - ${{ matrix.configuration }}
          path: Build
          if-no-files-found: warn